version: '3'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - API_KEY=${API_KEY:-test_api_key}
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=*
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000 